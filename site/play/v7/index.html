<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>v7 · Crowd · Causal Blocks</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap">
<link rel="stylesheet" href="../../css/site.css">
<link rel="stylesheet" href="../../css/game.css">
<link rel="stylesheet" href="v2.css">
</head>
<body class="game-page v2">
<div class="v2-wrap">
  <header class="v2-top">
    <a class="brand" href="../../play.html">← All versions</a>
    <span class="v2-level" id="level-name"></span>
  </header>

  <section class="v2-bar" aria-live="polite">
    <h1 id="story" class="v2-story"></h1>
    <div id="panel" class="v2-panel"></div>
  </section>

  <div class="v2-halves">
    <section class="v2-diagram" aria-label="The diagram">
      <svg id="canvas" class="v2-canvas" viewBox="0 0 440 260" role="img" aria-label="The diagram: boxes and the arrows you draw between them"></svg>
      <p id="toast" class="v2-toast" role="status" hidden></p>
    </section>
    <section class="v2-crowd" aria-label="The crowd">
      <p class="v2-crowd-is" id="crowd-is"></p>
      <svg id="crowd" viewBox="0 0 440 300" role="img" aria-label="The crowd"></svg>
    </section>
  </div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
