name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Needed only to rasterise DAGs to PNG; the tests inspect DOT source
      # rather than images, but the notebooks render for real.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  notebooks:
    # The tests cover duplo/, but the notebooks are the actual deliverable and
    # they exercise DoWhy far harder. A DoWhy 0.14 regression broke one of them
    # in a way the unit tests could not see, so they get executed here too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Execute notebooks
        working-directory: notebooks
        run: |
          for nb in *.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --stdout \
              --ExecutePreprocessor.timeout=900 "$nb" > /dev/null
            echo "::endgroup::"
          done
