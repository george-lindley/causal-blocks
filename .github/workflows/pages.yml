name: pages

# Publishes site/ to GitHub Pages. The site is static: estimates run in the
# browser and the case studies' data are plain CSVs, so there is nothing to build.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The worksheets are unpublished for now (2026-10-16): their pages and data stay in the repo, but
      # not on the site. Delete these lines to bring them back.
      - name: Copy the site, without the worksheets
        run: |
          mkdir _site && cp -r site/. _site/
          rm -f _site/worksheets.html _site/case-studies.html
          rm -rf _site/data/worksheets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
